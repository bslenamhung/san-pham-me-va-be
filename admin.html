<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản trị · Sản phẩm mẹ và bé</title><link rel="stylesheet" href="style.css"></head><body><header class="header"><a class="brand" href="./"><span class="heart">♥</span><span><b>QUẢN TRỊ CỬA HÀNG</b><small>Sản phẩm mẹ và bé BS Hùng</small></span></a><a class="adminlink" href="./">Trang bán hàng</a></header><main class="wrap admin"><section id="login" class="panel login"><h1>Đăng nhập quản trị</h1><form id="login-form"><label>Email<input name="email" type="email" required autocomplete="username"></label><label>Mật khẩu<input name="password" type="password" required autocomplete="current-password"></label><button class="btn primary">Đăng nhập</button><p id="login-msg"></p></form></section><section id="dashboard" hidden><div class="sectionhead"><h1>Đơn đặt hàng</h1><button id="logout" class="btn">Đăng xuất</button></div><p id="admin-msg"></p><div id="orders"></div><section class="panel"><h2>Thêm / sửa sản phẩm</h2><form id="product-form" class="formgrid"><input type="hidden" name="id"><label>Tên sản phẩm<input name="name" required maxlength="180"></label><label>Giá bán (VNĐ)<input name="price_vnd" type="number" min="1" required></label><label>Danh mục<select name="category" required><option value="Thực phẩm chức năng cho mẹ">Thực phẩm chức năng cho mẹ</option><option value="Thực phẩm chức năng cho bé">Thực phẩm chức năng cho bé</option></select></label><label class="wide">Ảnh sản phẩm<input name="image_file" type="file" accept="image/jpeg,image/png,image/webp,image/avif"><small>Chọn ảnh từ iPhone hoặc máy tính (tối đa 5 MB). Khi sửa, có thể chọn ảnh mới để thay ảnh cũ.</small><img id="image-preview" alt="Xem trước ảnh sản phẩm" hidden style="display:none;max-width:180px;max-height:180px;object-fit:contain;border-radius:12px;margin-top:8px"><input name="image_url" type="hidden"></label><label class="wide">Mô tả<textarea name="description" rows="2"></textarea></label><label class="wide">Thành phần công bố<textarea name="declared_ingredients" rows="4" maxlength="5000" placeholder="Nhập thành phần theo nhãn công bố của nhà sản xuất"></textarea></label><label class="wide">Liên kết nguồn công bố<input name="source_url" type="url" placeholder="https://..."><small>Nhập đường dẫn đến nhãn sản phẩm hoặc trang thông tin chính thức để bệnh nhân tham khảo.</small></label><label><input name="is_active" type="checkbox" checked> Hiển thị</label><div><button class="btn primary">Lưu sản phẩm</button><button type="button" id="cancel-edit" class="btn">Hủy sửa</button></div></form></section><h2>Sản phẩm hiện có</h2><div id="products-admin"></div></section></main><script src="config.js"></script><script type="module" src="admin.js"></script></body></html>
