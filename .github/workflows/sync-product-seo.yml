name: Sync product SEO pages

on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate-product-pages.mjs'
      - '.github/workflows/sync-product-seo.yml'
      - 'config.js'
  workflow_dispatch:
  schedule:
    - cron: "31 */6 * * *"

permissions:
  contents: write

concurrency:
  group: sync-product-seo
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate static product pages and sitemap
        run: node scripts/generate-product-pages.mjs
      - name: Commit generated pages
        run: |
          if [[ -n "$(git status --porcelain -- san-pham sitemap-products.xml)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add san-pham sitemap-products.xml
            git commit -m "chore: sync static product SEO pages"
            git push origin main
          else
            echo "No product SEO changes."
          fi
